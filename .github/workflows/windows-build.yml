name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build and test dependencies
        run: python -m pip install pyinstaller==6.22.3 openpyxl==3.1.5
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ExcelUnmergeFill excel_unmerge_gui.py
      - name: Test packaged application
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$PWD/dist/ExcelUnmergeFill.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) {
            throw "Packaged application self-test failed with exit code $($app.ExitCode)"
          }
      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: ExcelUnmergeFill-Windows-x64
          path: dist/ExcelUnmergeFill.exe
          if-no-files-found: error
